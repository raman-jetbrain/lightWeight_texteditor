name: Build Windows EXE
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name Angelified "lightweight_editor (1).py"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Angelified.exe
